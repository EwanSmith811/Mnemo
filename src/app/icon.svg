<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#g1)" stroke-width="3" opacity="0.3"/>
  <!-- Inner orbital -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#g2)" stroke-width="2" opacity="0.2"/>
  <!-- M letterform - neural style -->
  <path d="M152 340V210l52 65 52-65 52 65 52-65v130" fill="none" stroke="url(#g1)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Vertex nodes -->
  <circle cx="152" cy="210" r="8" fill="#60a5fa" opacity="0.9"/>
  <circle cx="204" cy="275" r="6" fill="#a78bfa" opacity="0.7"/>
  <circle cx="256" cy="210" r="10" fill="#c084fc"/>
  <circle cx="308" cy="275" r="6" fill="#a78bfa" opacity="0.7"/>
  <circle cx="360" cy="210" r="8" fill="#f472b6" opacity="0.9"/>
  <!-- Ambient dots -->
  <circle cx="130" cy="160" r="3" fill="#60a5fa" opacity="0.4"/>
  <circle cx="382" cy="160" r="3" fill="#f472b6" opacity="0.4"/>
  <circle cx="256" cy="380" r="3" fill="#a78bfa" opacity="0.3"/>
</svg>
